name: Build Nodus for Windows

on:
  push:
    branches: [main, design-reference-v0.4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Nodus
        shell: cmd
        run: |
          if not exist bin mkdir bin
          cl /nologo /O2 /W4 /D_CRT_SECURE_NO_WARNINGS src\main.c user32.lib gdi32.lib /link /SUBSYSTEM:WINDOWS /OUT:bin\Nodus.exe

      - name: Prepare package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item bin\Nodus.exe dist\Nodus.exe
          Copy-Item README.md dist\README.md
          Copy-Item INSTALAR_NODUS.bat dist\INSTALAR_NODUS.bat
          Copy-Item installer\install.ps1 dist\install.ps1
          Compress-Archive -Path dist\* -DestinationPath Nodus-Windows-v0.4.0.zip -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Nodus-Windows-v0.4.0
          path: Nodus-Windows-v0.4.0.zip
          retention-days: 30
