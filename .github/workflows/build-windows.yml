name: Build Nodus Tauri for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build with the same command used locally
        shell: cmd
        run: call build.bat

      - name: Prepare package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist-package | Out-Null
          Copy-Item src-tauri\target\release\nodus.exe dist-package\Nodus.exe
          $installer = Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          Copy-Item $installer.FullName dist-package\Nodus-Setup-v0.6.0.exe
          Copy-Item README.md dist-package\README.md
          Compress-Archive -Path dist-package\* -DestinationPath Nodus-Windows-v0.6.0.zip -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Nodus-Windows-v0.6.0
          path: Nodus-Windows-v0.6.0.zip
          retention-days: 30
